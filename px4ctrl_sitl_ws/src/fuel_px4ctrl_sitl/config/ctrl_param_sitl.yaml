# Simulation-only copy of the onboard px4ctrl parameters.
# no_RC is enabled so SITL does not require a physical transmitter. Auto arm is
# only attempted after an explicit TakeoffLand::TAKEOFF message is received.

mass: 1.0
gra: 9.81
pose_solver: 0
ctrl_freq_max: 200.0
max_manual_vel: 1.0
max_angle: 80
low_voltage: 21.0

rc_reverse:
    roll: false
    pitch: false
    yaw: false
    throttle: true

auto_takeoff_land:
    enable: true
    enable_auto_arm: true
    no_RC: true
    takeoff_height: 0.8
    takeoff_land_speed: 0.2

thrust_model:
    print_value: false
    accurate_thrust_model: false
    noisy_imu: false
    K1: 0.7583
    K2: 1.6942
    K3: 0.6786
    hover_percentage: 0.59

gain:
    Kp0: 2.5
    Kp1: 2.5
    Kp2: 2.5
    Kv0: 3.0
    Kv1: 3.0
    Kv2: 3.0
    Kvi0: 0.0
    Kvi1: 0.0
    Kvi2: 0.0
    Kvd0: 0.0
    Kvd1: 0.0
    Kvd2: 0.0
    KAngR: 20.0
    KAngP: 20.0
    KAngY: 4.0

rotor_drag:
    x: 0.0
    y: 0.0
    z: 0.0
    k_thrust_horz: 0.0

msg_timeout:
    odom: 0.5
    rc: 0.5
    cmd: 0.5
    imu: 0.5
    bat: 0.5
